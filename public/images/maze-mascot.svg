<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mazeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Wall Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Cyan Path (Left Eye) -->
    <linearGradient id="pathCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Red Target (Right Eye) -->
    <linearGradient id="targetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="mazeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#mazeShadow)">
    <!-- Base Rounded Tile -->
    <rect x="20" y="20" width="280" height="280" rx="36" fill="url(#mazeSky)" stroke="#92400e" stroke-width="2" />

    <!-- Labyrinth Inner Board -->
    <rect x="44" y="44" width="232" height="232" rx="20" fill="#1e1b4b" opacity="0.9" stroke="#b45309" stroke-width="4" />

    <!-- Labyrinth Walls (Isometric/Flat Grid) -->
    <g stroke="url(#wallGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer perimeter inset -->
      <path d="M 74 74 L 246 74 L 246 246 L 74 246 Z" fill="none" opacity="0.3" stroke-width="3" />

      <!-- Maze Internal Barriers -->
      <path d="M 74 114 L 140 114 L 140 156" fill="none" />
      <path d="M 174 74 L 174 114 L 214 114" fill="none" />
      <path d="M 104 156 L 104 214 L 144 214" fill="none" />
      <path d="M 144 184 L 214 184 L 214 144 L 246 144" fill="none" />
      <path d="M 174 214 L 174 246" fill="none" />
      <path d="M 104 74 L 104 90" fill="none" />
    </g>

    <!-- Solved Dichoptic Path (Cyan glowing route) -->
    <path d="M 74 90 L 74 134 L 120 134 L 120 170 L 160 170 L 160 130 L 194 130 L 194 160 L 230 160 L 230 200" 
          stroke="url(#pathCyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

    <!-- Start Runner (Cyan Eye Icon / Dot) -->
    <circle cx="74" cy="90" r="10" fill="#38bdf8" />
    <circle cx="74" cy="90" r="5" fill="#ffffff" />

    <!-- Goal / Target (Red Beacon / Flag) -->
    <circle cx="230" cy="200" r="12" fill="url(#targetRed)" />
    <circle cx="230" cy="200" r="6" fill="#ffffff" />
    <!-- Pulse ring on target -->
    <circle cx="230" cy="200" r="17" stroke="#f87171" stroke-width="2" stroke-dasharray="3 3" fill="none" />
  </g>
</svg>
