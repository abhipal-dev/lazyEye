<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="birdBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="birdBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="birdWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="birdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#birdShadow)">
    <!-- Little Feet -->
    <path d="M 140 255 L 140 275 M 130 275 L 145 275 M 140 275 L 148 272" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
    <path d="M 180 255 L 180 275 M 172 275 L 187 275 M 180 275 L 188 272" stroke="#f97316" stroke-width="4" stroke-linecap="round" />

    <!-- Cute Round Body -->
    <circle cx="160" cy="165" r="75" fill="url(#birdBody)" />

    <!-- Top Head Feather Tufts -->
    <path d="M 160 90 C 155 70, 145 72, 148 85 M 165 90 C 170 65, 185 68, 175 88" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Left Wing (Flapping) -->
    <path d="M 85 160 C 65 140, 50 165, 75 190 C 95 200, 105 180, 95 165 Z" fill="url(#birdWing)" />
    <!-- Right Wing (Flapping) -->
    <path d="M 235 160 C 255 140, 270 165, 245 190 C 225 200, 215 180, 225 165 Z" fill="url(#birdWing)" />

    <!-- Soft Creamy Belly Patch -->
    <ellipse cx="160" cy="190" rx="46" ry="40" fill="url(#birdBelly)" />

    <!-- Big Cute Happy Eyes -->
    <ellipse cx="135" cy="145" rx="10" ry="12" fill="#1e293b" />
    <ellipse cx="185" cy="145" rx="10" ry="12" fill="#1e293b" />

    <!-- Eye Highlights -->
    <circle cx="132" cy="140" r="4.5" fill="#ffffff" />
    <circle cx="182" cy="140" r="4.5" fill="#ffffff" />
    <circle cx="137" cy="147" r="1.5" fill="#ffffff" />
    <circle cx="187" cy="147" r="1.5" fill="#ffffff" />

    <!-- Cute Triangle Beak (Orange) -->
    <polygon points="150,155 170,155 160,172" fill="#ea580c" />
    <polygon points="152,156 168,156 160,163" fill="#fb923c" />

    <!-- Sweet Cheerful Blushes -->
    <ellipse cx="118" cy="162" rx="7" ry="4" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="202" cy="162" rx="7" ry="4" fill="#f43f5e" opacity="0.45" />
  </g>
</svg>

