<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="snakeHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="snakeHood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="snakeBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Coiled Base Body -->
  <g filter="url(#dropShadow)">
    <!-- Bottom Coil -->
    <ellipse cx="160" cy="275" rx="100" ry="24" fill="#14532d" opacity="0.3" />
    <path d="M 75 255 C 65 240, 80 220, 105 220 C 130 220, 140 240, 160 240 C 180 240, 190 220, 215 220 C 240 220, 255 240, 245 255 C 235 270, 205 275, 160 275 C 115 275, 85 270, 75 255 Z" fill="url(#snakeBody)" />
    <!-- Coil Highlights -->
    <ellipse cx="95" cy="242" rx="20" ry="14" fill="#4ade80" opacity="0.6" />
    <ellipse cx="225" cy="242" rx="20" ry="14" fill="#4ade80" opacity="0.6" />

    <!-- Snake Hood Outer Flaps -->
    <path d="M 85 140 C 70 85, 120 40, 160 40 C 200 40, 250 85, 235 140 C 228 170, 210 200, 195 230 L 125 230 C 110 200, 92 170, 85 140 Z" fill="url(#snakeHood)" />

    <!-- Hood Decorative Pattern Bands -->
    <path d="M 105 100 C 130 80, 190 80, 215 100 C 205 125, 115 125, 105 100 Z" fill="#15803d" opacity="0.7" />
    <path d="M 115 80 C 135 65, 185 65, 205 80" stroke="#86efac" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Snake Head Dome -->
    <ellipse cx="160" cy="100" rx="58" ry="52" fill="url(#snakeHead)" />

    <!-- Belly Underbelly Area -->
    <path d="M 128 140 C 130 115, 190 115, 192 140 C 190 175, 188 230, 186 265 C 186 270, 134 270, 134 265 C 132 230, 130 175, 128 140 Z" fill="url(#snakeBelly)" />

    <!-- Belly Horizontal Segment Lines -->
    <line x1="130" y1="165" x2="190" y2="165" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <line x1="131" y1="190" x2="189" y2="190" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <line x1="132" y1="215" x2="188" y2="215" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <line x1="133" y1="240" x2="187" y2="240" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Cute Big Round Eyes -->
    <circle cx="135" cy="95" r="11" fill="#1e293b" />
    <circle cx="185" cy="95" r="11" fill="#1e293b" />

    <!-- Eye Highlights -->
    <circle cx="132" cy="92" r="4" fill="#ffffff" />
    <circle cx="182" cy="92" r="4" fill="#ffffff" />
    <circle cx="137" cy="98" r="1.5" fill="#ffffff" />
    <circle cx="187" cy="98" r="1.5" fill="#ffffff" />

    <!-- Cute Smile -->
    <path d="M 152 114 Q 160 118 168 114" stroke="#14532d" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Red Forked Tongue -->
    <path d="M 160 116 L 160 135 L 154 144 M 160 135 L 166 144" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Cheerful Blushes -->
    <ellipse cx="123" cy="108" rx="6" ry="3.5" fill="#f87171" opacity="0.5" />
    <ellipse cx="197" cy="108" rx="6" ry="3.5" fill="#f87171" opacity="0.5" />
  </g>
</svg>

