<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="stickHeroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9ee" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <!-- Rolling Hills -->
    <linearGradient id="hillBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="hillFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Pillar 1 (Left Hero Pillar - Dichoptic Blue) -->
    <linearGradient id="pillarLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Pillar 2 (Right Target Pillar) -->
    <linearGradient id="pillarRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bridge Stick / Ladder (Gold/Amber with glowing edges) -->
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Headband Gradient -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#softCardShadow)">
    <!-- Base Rounded App Tile -->
    <rect x="20" y="20" width="280" height="280" rx="36" fill="url(#stickHeroSky)" stroke="#e2e8f0" stroke-width="2" />

    <!-- Distant Background Hills -->
    <path d="M 20 220 Q 80 185 150 205 Q 220 225 300 190 L 300 300 L 20 300 Z" fill="url(#hillBackGrad)" opacity="0.65" />
    <path d="M 20 235 Q 90 205 180 225 Q 250 240 300 215 L 300 300 L 20 300 Z" fill="url(#hillFrontGrad)" opacity="0.85" />

    <!-- Minimalist Pine Trees in Background -->
    <!-- Tree 1 -->
    <rect x="78" y="195" width="4" height="20" fill="#713f12" />
    <polygon points="80,165 70,185 90,185" fill="#15803d" />
    <polygon points="80,178 68,198 92,198" fill="#166534" />
    <!-- Tree 2 -->
    <rect x="188" y="190" width="3" height="18" fill="#713f12" />
    <polygon points="189.5,162 181,180 198,180" fill="#15803d" />
    <polygon points="189.5,174 179,192 200,192" fill="#166534" />

    <!-- Left Pillar (Where hero stands) -->
    <rect x="52" y="150" width="80" height="150" rx="4" fill="url(#pillarLeftGrad)" />
    <!-- Pillar highlight rim -->
    <rect x="52" y="150" width="80" height="4" fill="#60a5fa" />
    <!-- Perfect Center Target Dot (Red dichoptic bonus point) -->
    <rect x="86" y="150" width="12" height="12" rx="2" fill="#ef4444" />

    <!-- Right Pillar (Destination Wall) -->
    <rect x="204" y="150" width="76" height="150" rx="4" fill="url(#pillarRightGrad)" />
    <rect x="204" y="150" width="76" height="4" fill="#3b82f6" />
    <!-- Perfect Center Target Dot on Destination -->
    <rect x="236" y="150" width="12" height="12" rx="2" fill="#ef4444" />

    <!-- Bridge Stick Fallen Perfectly Across the Chasm -->
    <!-- The bridge connects from x=132 to x=220 (perfect landing!) -->
    <rect x="132" y="146" width="92" height="6" rx="3" fill="url(#stickGrad)" stroke="#b45309" stroke-width="0.5" />
    
    <!-- Motion Pivot Arc (shows the stick rotated from upright) -->
    <path d="M 132 58 A 90 90 0 0 1 222 148" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.7" />

    <!-- Stick Hero Character (Walking confidently on left pillar toward bridge) -->
    <!-- Shadow beneath hero -->
    <ellipse cx="112" cy="151" rx="14" ry="3" fill="#0f172a" opacity="0.3" />

    <!-- Hero Legs -->
    <rect x="104" y="132" width="6" height="17" rx="3" fill="#0f172a" />
    <rect x="114" y="132" width="6" height="17" rx="3" fill="#0f172a" />

    <!-- Hero Body (Solid Ninja Silhouette) -->
    <rect x="100" y="96" width="24" height="40" rx="10" fill="#0f172a" />

    <!-- Ninja Headband (Amber/Orange) -->
    <rect x="99" y="103" width="26" height="8" rx="2" fill="url(#headbandGrad)" />
    <!-- Headband Knot & Fluttering Tails in Wind -->
    <path d="M 99 105 L 82 92 L 86 103 L 74 105 L 86 112 Z" fill="url(#headbandGrad)" />

    <!-- Glowing Eye / Visor (Looking right towards the bridge) -->
    <ellipse cx="118" cy="107" rx="4.5" ry="3.5" fill="#ffffff" />
    <ellipse cx="119" cy="107" rx="2" ry="2" fill="#0f172a" />

    <!-- Sparkle on perfect stick landing -->
    <path d="M 224 140 L 226 146 L 232 148 L 226 150 L 224 156 L 222 150 L 216 148 L 222 146 Z" fill="#fbbf24" />
    <circle cx="224" cy="148" r="2" fill="#ffffff" />
  </g>
</svg>