<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bounceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="bounceShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#bounceShadow)">
    <!-- Parabolic Bounce Arcs -->
    <path d="M 50 240 Q 100 120 150 240 Q 200 140 250 240" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,6" fill="none" opacity="0.7" />

    <!-- Trampoline / Bounce Platform -->
    <rect x="40" y="240" width="240" height="14" rx="7" fill="url(#groundGrad)" />
    <!-- Pillars -->
    <rect x="70" y="254" width="14" height="26" rx="4" fill="#991b1b" />
    <rect x="153" y="254" width="14" height="26" rx="4" fill="#991b1b" />
    <rect x="236" y="254" width="14" height="26" rx="4" fill="#991b1b" />

    <!-- Trailing ghost bounces -->
    <circle cx="85" cy="180" r="20" fill="#93c5fd" opacity="0.3" />
    <circle cx="120" cy="140" r="28" fill="#60a5fa" opacity="0.45" />

    <!-- Main Active Bouncing Mascot Ball -->
    <circle cx="170" cy="110" r="50" fill="url(#bounceGrad)" />
    <!-- Shine highlight -->
    <ellipse cx="152" cy="88" rx="18" ry="11" fill="#ffffff" opacity="0.4" transform="rotate(-30 152 88)" />

    <!-- Happy Face -->
    <circle cx="158" cy="108" r="8" fill="#ffffff" />
    <circle cx="184" cy="108" r="8" fill="#ffffff" />
    <circle cx="160" cy="108" r="5" fill="#0f172a" />
    <circle cx="186" cy="108" r="5" fill="#0f172a" />
    <circle cx="159" cy="105" r="2" fill="#ffffff" />
    <circle cx="185" cy="105" r="2" fill="#ffffff" />

    <!-- Big energetic smile -->
    <path d="M 164 124 Q 172 136 180 124" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Speed Lines -->
    <line x1="230" y1="90" x2="250" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="235" y1="105" x2="260" y2="100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="228" y1="120" x2="252" y2="120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>

