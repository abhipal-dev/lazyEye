<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bubbleCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="bubbleRose" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <radialGradient id="bubbleGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="bubbleGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#4ade80" />
      <stop offset="70%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <filter id="bubbleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#bubbleDrop)">
    <!-- Targeting Crosshair Ring -->
    <circle cx="160" cy="160" r="110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.4" />
    <line x1="160" y1="35" x2="160" y2="70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="160" y1="250" x2="160" y2="285" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="35" y1="160" x2="70" y2="160" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="250" y1="160" x2="285" y2="160" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Big Center Bubble (Cyan) -->
    <circle cx="160" cy="160" r="48" fill="url(#bubbleCyan)" />
    <ellipse cx="145" cy="140" rx="14" ry="7" fill="#ffffff" opacity="0.75" transform="rotate(-30 145 140)" />

    <!-- Upper Bubble (Rose Red) -->
    <circle cx="160" cy="80" r="38" fill="url(#bubbleRose)" />
    <ellipse cx="148" cy="65" rx="11" ry="5.5" fill="#ffffff" opacity="0.75" transform="rotate(-30 148 65)" />

    <!-- Right Bubble (Gold) -->
    <circle cx="230" cy="140" r="36" fill="url(#bubbleGold)" />
    <ellipse cx="220" cy="125" rx="10" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-30 220 125)" />

    <!-- Left Bubble (Emerald Green) -->
    <circle cx="90" cy="150" r="36" fill="url(#bubbleGreen)" />
    <ellipse cx="80" cy="135" rx="10" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-30 80 135)" />

    <!-- Lower Right Bubble -->
    <circle cx="215" cy="225" r="32" fill="url(#bubbleRose)" opacity="0.9" />

    <!-- Lower Left Bubble -->
    <circle cx="105" cy="225" r="32" fill="url(#bubbleCyan)" opacity="0.9" />
  </g>
</svg>

