<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Motion trails -->
    <path d="M 160 50 Q 180 80 160 110" stroke="#f87171" stroke-width="4" stroke-dasharray="6,6" fill="none" opacity="0.6" />
    <path d="M 140 60 Q 150 85 145 105" stroke="#f87171" stroke-width="3" stroke-dasharray="4,4" fill="none" opacity="0.4" />

    <!-- Catch Target Rings -->
    <circle cx="160" cy="220" r="70" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.4" />
    <circle cx="160" cy="220" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.7" />

    <!-- Catcher Paddle / Basket -->
    <path d="M 90 220 C 90 270 230 270 230 220 L 220 215 C 210 250 110 250 100 215 Z" fill="url(#basketGrad)" />
    <ellipse cx="160" cy="215" rx="65" ry="14" fill="#38bdf8" opacity="0.5" />

    <!-- Falling Red Ball Mascot -->
    <circle cx="160" cy="115" r="46" fill="url(#ballGrad)" />
    <!-- Ball Highlight -->
    <ellipse cx="145" cy="95" rx="16" ry="10" fill="#ffffff" opacity="0.4" transform="rotate(-30 145 95)" />

    <!-- Cute Eyes -->
    <circle cx="148" cy="112" r="8" fill="#1e293b" />
    <circle cx="172" cy="112" r="8" fill="#1e293b" />
    <circle cx="146" cy="109" r="3" fill="#ffffff" />
    <circle cx="170" cy="109" r="3" fill="#ffffff" />

    <!-- Happy Mouth -->
    <path d="M 154 126 Q 160 134 166 126" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cheerful Blushes -->
    <ellipse cx="138" cy="122" rx="6" ry="3" fill="#ffffff" opacity="0.3" />
    <ellipse cx="182" cy="122" rx="6" ry="3" fill="#ffffff" opacity="0.3" />

    <!-- Golden Star Sparkles -->
    <polygon points="75,90 78,98 86,98 80,103 82,111 75,106 68,111 70,103 64,98 72,98" fill="#eab308" />
    <polygon points="245,85 247,91 253,91 248,95 250,101 245,97 240,101 242,95 237,91 243,91" fill="#eab308" />
  </g>
</svg>

